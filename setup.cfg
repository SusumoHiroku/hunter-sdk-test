[flake8]
dictionaries = en_US,python,technical,django
ignore =
    W503,
    WPS226,
    WPS227,
    WPS235,
    WPS473,
    WPS601,
    DAR101,
    DAR201,
    DAR301,
    DAR401
max-line-length = 120
max-complexity = 10
max-module-members = 10
max-methods = 10
max-local-variables = 10
max-arguments = 8
max-returns = 3
max-expressions = 10
max-cognitive-complexity = 12
exclude =
    .tox,
    .git,
    */migrations/*,
    */static/CACHE/*,
    docs,
    node_modules,
    venv,
    .venv

[pycodestyle]
max-line-length = 120
exclude =
    .tox,
    .git,
    */migrations/*,
    */static/CACHE/*,
    docs,
    node_modules,
    venv,
    .venv

[mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true