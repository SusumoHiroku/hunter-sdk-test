[flake8]
max-line-length = 80
max-complexity = 10
max-module-members = 10
max-methods = 10
max-local-variables = 10
max-arguments = 8
max-returns = 3
max-expressions = 10
max-cognitive-complexity = 12
extend-default-ignore =
    WPS305,
    WPS306,
    WPS412,
    WPS202,
per-file-ignores =
    hunter_sdk/__init__.py: F401, WPS235

[mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
